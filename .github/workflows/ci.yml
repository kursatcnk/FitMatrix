name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # The checked-in NuGet.Config points at a local D: cache; CI keeps packages in the workspace.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ hashFiles('backend/*.csproj', 'backend.tests/*.csproj') }}
      - run: dotnet test FitMatrix.slnx --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Overrides the local D: cache path in frontend/.npmrc.
      npm_config_cache: ${{ github.workspace }}/.npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      npm_config_cache: ${{ github.workspace }}/.npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach
      - name: Smoke test the running stack
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/system/health > health.json; then break; fi
            sleep 5
          done
          cat health.json
          jq -e '.database == "connected" and .productCount >= 1000' health.json
          curl -fsS http://localhost:8080/ | grep -q "<div id=\"root\">"
          curl -fsS "http://localhost:8080/api/catalog/products?limit=5" | jq -e 'length == 5'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
